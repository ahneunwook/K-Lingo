spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  jpa:
    hibernate:
      ddl-auto: validate  # 운영에서는 검증만
    properties:
      hibernate:
        format_sql: false
        show_sql: false  # SQL 로그 끄기

logging:
  level:
    root: INFO
    com.kdopamine.app: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: INFO
  file:
    name: /var/log/kdopamine/application.log
    max-size: 10MB
    max-history: 30

